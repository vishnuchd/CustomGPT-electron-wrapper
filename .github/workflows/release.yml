name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    permissions:
      contents: write

    env:
      CI: true
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # =========================
      # WINDOWS DEPENDENCIES
      # =========================
      - name: Clean node_modules (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          if exist node_modules rmdir /s /q node_modules

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        timeout-minutes: 40
        env:
          npm_config_force: true
        run: |
          npm install --foreground-scripts --loglevel=info

      # =========================
      # MAC / LINUX DEPENDENCIES
      # =========================
      - name: Install dependencies (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: npm ci

      # =========================
      # WINDOWS SIGNING
      # =========================
      - name: Setup Java (CodeSignTool)
        if: matrix.os == 'windows-latest' && env.SSL_COM_USERNAME && env.SSL_COM_USERNAME != ''
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}

      - name: Download SSL.com CodeSignTool
        if: matrix.os == 'windows-latest' && env.SSL_COM_USERNAME && env.SSL_COM_USERNAME != ''
        shell: cmd
        run: |
          echo Downloading CodeSignTool...
          curl -L --retry 5 --retry-delay 5 ^
            https://www.ssl.com/download/codesigntool-for-windows/ ^
            -o CodeSignTool.zip

          tar -xf CodeSignTool.zip -C CodeSignTool


      # =========================
      # BUILD & PUBLISH
      # =========================
      - name: Build and Publish (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          CODE_SIGN_TOOL_PATH: ${{ github.workspace }}\CodeSignTool
        run: npm run build:publish

      - name: Build and Publish (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac:publish

      - name: Build and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:publish
