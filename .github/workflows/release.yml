name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    permissions:
      contents: write

    env:
      CI: true
      SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # =========================
      # WINDOWS DEPENDENCIES
      # =========================
      - name: Clean node_modules (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          if exist node_modules rmdir /s /q node_modules

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        timeout-minutes: 40
        env:
          npm_config_force: true
        run: |
          npm install --foreground-scripts --loglevel=info

      # =========================
      # MAC / LINUX DEPENDENCIES
      # =========================
      - name: Install dependencies (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: npm ci

      # =========================
      # WINDOWS RELEASE (Download from Staging)
      # =========================
      - name: Extract version from tag
        if: matrix.os == 'windows-latest'
        id: get_version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Download Windows Artifacts
        if: matrix.os == 'windows-latest'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_BUCKET_NAME: ${{ secrets.SUPABASE_BUCKET_NAME }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: npm run download:windows

      - name: Create Release (if not exists)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --repo vishnuchd/customGPT-electron-release --title "${{ github.ref_name }}" --generate-notes || echo "Release already exists"

      - name: Upload Windows Assets to Release
        if: matrix.os == 'windows-latest'
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} dist/*.exe dist/*.msi dist/*.blockmap dist/*.yml --repo vishnuchd/customGPT-electron-release --clobber

      - name: Build and Publish (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac:publish

      - name: Build and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npm run build:publish
