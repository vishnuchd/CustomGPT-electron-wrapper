name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Disable Windows Defender to prevent file locking issues
      - name: Disable Windows Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Write-Host "Windows Defender exclusions added"

      # Use npm ci with clean install and retry logic for Windows
      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Clean install with retries
          $maxRetries = 3
          $retryCount = 0
          $success = $false
          
          while (-not $success -and $retryCount -lt $maxRetries) {
            try {
              Write-Host "Installation attempt $($retryCount + 1) of $maxRetries"
              
              # Remove node_modules if it exists
              if (Test-Path "node_modules") {
                Write-Host "Removing existing node_modules..."
                Remove-Item -Recurse -Force "node_modules" -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 2
              }
              
              # Clean npm cache
              npm cache clean --force
              
              # Install with ci for clean install
              npm ci --prefer-offline --no-audit
              
              $success = $true
              Write-Host "Installation successful!"
            }
            catch {
              $retryCount++
              Write-Host "Installation failed: $_"
              if ($retryCount -lt $maxRetries) {
                $waitTime = [math]::Pow(2, $retryCount)
                Write-Host "Waiting $waitTime seconds before retry..."
                Start-Sleep -Seconds $waitTime
              }
            }
          }
          
          if (-not $success) {
            Write-Error "Failed to install dependencies after $maxRetries attempts"
            exit 1
          }

      - name: Install dependencies (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: npm i

      # ==========================================
      # WINDOWS SIGNING SETUP (SSL.com EV Cloud)
      # ==========================================
      - name: Setup Java (Reduced JDK for CodeSignTool)
        if: matrix.os == 'windows-latest' && env.SSL_COM_USERNAME != ''
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}

      - name: Download SSL.com CodeSignTool
        if: matrix.os == 'windows-latest' && env.SSL_COM_USERNAME != ''
        shell: pwsh
        run: |
          Write-Host "Downloading CodeSignTool..."
          Invoke-WebRequest -Uri "https://www.ssl.com/download/codesigntool-for-windows/" -OutFile "CodeSignTool.zip"
          Expand-Archive -Path "CodeSignTool.zip" -DestinationPath "CodeSignTool"
          Write-Host "CodeSignTool installed to $(Get-Location)/CodeSignTool"
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}

      # ==========================================
      # BUILD & PUBLISH
      # ==========================================

      - name: Build and Publish (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SSL.com Signer Secrets
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          # Tell hook where CST is (in the workspace)
          CODE_SIGN_TOOL_PATH: ${{ github.workspace }}\CodeSignTool
        run: npm run build -- --publish always

      - name: Build and Publish (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # MacOS Signing Secrets
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Use simple build:mac command, electron-builder handles signing if env vars are present
        run: npm run build:mac -- --publish always

      - name: Build and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --linux --publish always
